[project]
name = "angelone-b2b-ai-content-generator"
version = "0.1.0"
description = "Angel One AI financial video generator V0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.45",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "requests>=2.31",
    "ffmpeg-python>=0.2",
    "pillow>=10.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
